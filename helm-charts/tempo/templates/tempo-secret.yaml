apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.storage.secret.name }}
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: {{ .Values.storage.secret.configs.externalSecretStoreRef.kind | default "ClusterSecretStore" }}
    name: {{ .Values.storage.secret.configs.externalSecretStoreRef.name }}
  target:
    name: {{ .Values.storage.secret.name }}
    creationPolicy: Owner
  data:
    {{- range .Values.storage.secret.configs.data }}
    - remoteRef:
        key: {{ .remoteKey }}
      secretKey: {{ .secretKey }}
    {{- end }}
