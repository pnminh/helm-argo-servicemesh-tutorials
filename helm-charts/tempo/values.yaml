storage:
  secret:
    name: tempo-azure-secret
    type: azure
    configs:
      externalSecretStoreRef:
        #kind: ClusterSecretStore
        #name: ocp-secrets-store
      data:
        # - remoteKey: tempo-store-account-key
        #   secretKey: account_key
        # - remoteKey: tempo-store-account-name
        #   secretKey: account_name
        # - remoteKey: tempo-store-container
        #   secretKey: container
  #storageClassName: dev

queryFrontend:
  replicas: 1
  resources:
    limits:
      memory: "1Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"

distributor:
  replicas: 3
  resources:
    limits:
      memory: "1Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"

compactor:
  replicas: 2
  resources:
    limits:
      memory: "3Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"

ingester:
  replicas: 3
  resources:
    limits:
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"

querier:
  replicas: 3
  resources:
    limits:
      memory: "3Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"

gateway:
  enabled: false
  replicas: 3
  resources:
    limits:
      memory: "1Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"

retention:
  global:
    traces: 72h0m0s

resources:
  total:
    limits:
      memory: "2Gi"
      cpu: "2"
virtualService:
  name: "tempo-query-frontend"
  hosts:
    - "*" 
  gateways:
    - "istio-ingress/tempo-gateway" 
  http:
    - match:
        - uri:
            prefix: "/"
      route:
        - destination:
            host: tempo-tempo-query-frontend
            port:
              number: 16686  # Update this if the service uses a different 