{{- if .Values.appSecrets -}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets-{{ .Release.Name }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.defaultClusterSecretStore }}
  target:
    name: app-secrets-{{ .Release.Name }}
    creationPolicy: Owner # https://external-secrets.io/latest/spec/#external-secrets.io/v1beta1.ExternalSecretCreationPolicy
  data:
    {{- toYaml .Values.appSecrets.data | nindent 4}}
{{- end }}
{{- if .Values.appConfig }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-config-{{ .Release.Name }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    checksum/app-config: {{ include (print $.Template.BasePath "/appconfig.yaml") . | sha256sum }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.defaultClusterSecretStore }}
  target:
    name: "app-config-{{ .Release.Name }}"
    template:
      engineVersion: v2
      templateFrom:
      - target: Data
        configMap:
          name: "app-config-{{ .Release.Name }}"
          items:
          - key: app-config.yaml
            templateAs: Values
    creationPolicy: Owner
  dataFrom:
  - find:
      name:
        regexp: '^{{ .Release.Name }}-'
    rewrite:
      - regexp:
          source: '^{{ .Release.Name }}-(.*)'
          target: '$1'
      - regexp:
          source: '-'
          target: '_'
  - find:
      name:
        regexp: '^global-'
    rewrite:
      - regexp:
          source: '-'
          target: '_'
{{- end }}
