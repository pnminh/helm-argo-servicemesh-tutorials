externalSecrets:
  defaultClusterSecretStore: "example-org-store"
  refreshInterval: 60s

appSecrets: {}
serviceMesh:
  enabled: true
  service:
    #name: service-api #optional, default to release name
    #routeHost: service-api.mesh.apps.dev.k8s.example-org.com  #if provided, expose the ap
    port: 8080 #use 8080 by default
    protocol: http # default to http, also support https,tls
  # otherServices: {}
  # otherServices:
  #   - name: externalA
  #     routeHost: externalA.mesh.apps.dev.k8s.example-org.com
  #     host: externalA.app-dev.example-org.com # or service-api.service-namespace if isExternal=false, using release name if not set
  #     port: 443
  #     isExternal: true # Set to true for external services
  #     protocol: https # default to http, also support https,tls
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75 # Target 75% CPU utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80 # Target 80% memory utilization
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 300
