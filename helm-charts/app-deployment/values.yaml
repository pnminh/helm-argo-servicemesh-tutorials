# Default values for app-deployment.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  registry: quay.io/example-org/registry-dev
  path: todo-ui
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.0.0"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
ports:
  - name: http
    containerPort: 8080
    protocol: TCP
service:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
route:
  enabled: false
  targetPort: 8080

blueGreen:
  enabled: false
  autoPromotionEnabled: false
  previewRoute:
    enabled: true
    host: ""

statefulSet:
  enabled: false
  serviceName: todo-ui

command: []

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

appConfig:
  example-org:
    env: local
    webservice:
      host: apps-local.example-org.com
      router: apirouter.apps-local.example-org.com
      routerApi: api-router-api.apps-local.example-org.com
    rabbitmq:
      host: rabbitmq-snd.example-org.com
      username: developer
      amqpProtocol: amqp
    attachments:
      host: http://attachments-api.apps-local.example-org.com
    mongodb:
      replicaSet:
        - "refresh-0.mongodb-snd.example-org.com:27000"
      replicaSetName: "refresh-mongodb"

