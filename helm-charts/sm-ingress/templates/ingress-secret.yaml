{{- $root := . -}}
{{- range  $ingressName, $ingressValues := .Values.ingresses  }}
{{- if $ingressValues.gateway.tlsSecrets }}
{{- range  $tlsSecret := $ingressValues.gateway.tlsSecrets  }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $tlsSecret.name }}
  labels:
    istio: {{ $ingressName }}
    app: {{ $ingressName }}
    {{- include "library-chart.labels" $root | nindent 4 }}
spec:
  secretStoreRef:
    kind: {{ $tlsSecret.configs.externalSecretStoreRef.kind | default "ClusterSecretStore" }}
    name: {{ $tlsSecret.configs.externalSecretStoreRef.name }}
  target:
    name: {{ $tlsSecret.name }}
    creationPolicy: Owner
  data:
    - remoteRef:
        key: {{  $tlsSecret.configs.externalSecretStoreRef.tlsCertRemoteKey | default (printf "%s-cert" $tlsSecret.name) }}
        decodingStrategy: Auto
      secretKey: tls.crt
    - remoteRef:
        key: {{  $tlsSecret.configs.externalSecretStoreRef.tlsKeyRemoteKey | default (printf "%s-key" $tlsSecret.name) }}
        decodingStrategy: Auto
      secretKey: tls.key      
{{- end }}
{{- end }}
{{- end }}