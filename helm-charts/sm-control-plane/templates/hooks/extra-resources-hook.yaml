
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-istio-resources-hook
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-istio-resources-hook
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["*"]  # This allows all actions (create, get, list, watch, update, patch, delete)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-istio-resources-hook
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-istio-resources-hook
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-istio-resources-hook
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-istio-resources-hook
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
data:
  extra-resources.yaml: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: cluster-monitoring-config
      namespace: openshift-monitoring
    data:
      config.yaml: |
        enableUserWorkload: true 
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-istio-resources-hook
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-istio-resources-hook
      containers:
        - name: add-remove-resources
          image: quay.io/openshift/origin-cli  # Use an image that contains kubectl
          command:
            - /bin/sh
            - -c
            - |- 
              # Create additional Kubernetes manifests provided in the Helm chart
              oc apply -f /manifests/extra-resources.yaml
          volumeMounts:
            - name: manifests
              mountPath: /manifests
      volumes:
        - name: manifests
          configMap:
            name: {{ .Release.Name }}-istio-resources-hook
      restartPolicy: Never
  backoffLimit: 4