{{- $root := . -}}
{{- range .Values.subscriptions }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    {{- include "library-chart.labels" $root | nindent 4 }}
spec:
  channel: {{ .channel }}
  installPlanApproval: {{ .installPlanApproval }}
  name: {{ .name }}
  source: {{ .source }}
  sourceNamespace: {{ .sourceNamespace }}
---
{{- end }}