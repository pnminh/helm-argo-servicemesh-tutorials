argo-applications:
  gitRepoUrl: https://github.example-org.com/gitops/day2-services.git
  gitTargetRevision: multi-clusters
  argoProject: default
  namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
  appsDir: apps/service-mesh/dev/apps
  apps:
    operators:
      namespace: openshift-operators
      enabled: true
      syncWave: 0
    smcp:
      namespace: istio-system
      enabled: true
      syncWave: 2
    tracing-system:
      namespace: tracing-system
      enabled: true
      syncWave: 3
      ignoreDifferences:
        - group: tempo.grafana.com
          kind: TempoStack
          jsonPointers:
            - /spec/storage
            - /spec/resources
            - /spec/retention
    kiali:
      namespace: istio-system
      enabled: true
      syncWave: 3
    ingresses:
      namespace: mesh
      enabled: true
      syncWave: 4
    sample-app:
      namespace: bookinfo
      enabled: true
      syncWave: 4
