argo-applications:
  gitRepoUrl: https://github.com/pnminh/helm-argo-servicemesh-tutorials.git
  gitTargetRevision: main
  argoProject: default
  namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
  appsDir: examples/infra/apps/service-mesh/clusters/ocp-dev1/apps
  apps:
    operators:
      namespace: openshift-operators
      enabled: true
      syncWave: 0
    smcp:
      namespace: istio-system
      enabled: true
      syncWave: 2
    tracing-system:
      namespace: tracing-system
      enabled: true
      syncWave: 3
      ignoreDifferences:
        - group: tempo.grafana.com
          kind: TempoStack
          jsonPointers:
            - /spec/storage
            - /spec/resources
            - /spec/retention
    kiali:
      namespace: istio-system
      enabled: true
      syncWave: 3
    ingresses:
      namespace: mesh
      enabled: true
      syncWave: 4
    sample-app:
      namespace: bookinfo
      enabled: true
      syncWave: 4
