apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: day2-services-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
          - git:
              repoURL: https://github.com/pnminh/helm-argo-servicemesh-tutorials.git
              revision: main
              directories:
                - path: examples/infra/apps/*/{{.name}}
  template:
    metadata:
      name: "day2-{{index .path.segments 1}}-{{.path.basenameNormalized}}"
    spec:
      # The project the application belongs to.
      project: default
      # Source of the application manifests
      source:
        repoURL: https://github.com/pnminh/helm-argo-servicemesh-tutorials.git
        targetRevision: main
        path: "examples/infra/apps/{{index .path.segments 1}}/environments/{{index .path.segments 2}}"
        helm:
          valueFiles:
            - "values.yaml"
          ignoreMissingValueFiles: true
          parameters:
            - name: "global.clusterName"
              value: "{{.path.basenameNormalized}}"
          releaseName: "{{index .path.segments 1}}"
      # Destination cluster and namespace to deploy the application
      destination:
        server: "{{.server}}"
        namespace: "{{index .path.segments 1}}"

      # Sync policy
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated: # automated sync by default retries failed attempts 5 times with following delays between attempts ( 5s, 10s, 20s, 40s, 80s ); retry controlled using `retry` field.
          prune: true # Specifies if resources should be pruned during auto-syncing ( false by default ).
          selfHeal: true # Specifies if partial app sync should be executed when resources are changed only in target Kubernetes cluster and no git change detected ( false by default ).
