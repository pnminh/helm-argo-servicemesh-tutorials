apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: day2-services-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
          - git:
              repoURL: https://github.com/pnminh/helm-argo-servicemesh-tutorials.git
              revision: main
              directories:
                - path: examples/infra/apps/*/clusters/*
  template:
    metadata:
      name: "day2-{{ index .path.segments 3 }}-{{ .path.basenameNormalized }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/pnminh/helm-argo-servicemesh-tutorials.git
        targetRevision: main
        path: "{{ .path.path }}"
        helm:
          valueFiles:
            - "values.yaml"
          ignoreMissingValueFiles: true
          parameters:
            - name: "global.clusterName"
              value: "{{ .path.basenameNormalized }}"
          releaseName: "{{ index .path.segments 3 }}"
      destination:
        server: "{{ .server }}"
        namespace: "{{ index .path.segments 3 }}"

      # Sync policy
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated: # automated sync by default retries failed attempts 5 times with following delays between attempts ( 5s, 10s, 20s, 40s, 80s ); retry controlled using `retry` field.
          prune: true # Specifies if resources should be pruned during auto-syncing ( false by default ).
          selfHeal: true # Specifies if partial app sync should be executed when resources are changed only in target Kubernetes cluster and no git change detected ( false by default ).
